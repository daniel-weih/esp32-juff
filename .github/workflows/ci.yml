name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./scripts/check_repository.sh
      - run: make firmware-tools-test

  host:
    name: Node host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: host/package-lock.json
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  macos-ble:
    name: macOS BLE companion
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./scripts/build_macos_ble.sh
      - run: ./macos/build/JuffBLE.app/Contents/MacOS/JuffBLE --self-test

  firmware:
    name: Firmware (${{ matrix.board }}, AEC ${{ matrix.aec }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        board: [waveshare-lcd-3.5, waveshare-lcd-1.54]
        aec: ["n", "y"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: |
            printf '\nCONFIG_JUFF_VOICE_BARGE_IN=${{ matrix.aec }}\n' >> boards/${{ matrix.board }}/sdkconfig.defaults
            make -C .. firmware-package JUFF_BOARD=${{ matrix.board }}
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}-aec-${{ matrix.aec }}
          path: dist/firmware/*/juff-${{ matrix.board }}-v*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
